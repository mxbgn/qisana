services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration-job:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && npx prisma db seed"
    restart: "no"

  backend:
    build:
      context: ./backend
    init: true
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      migration-job:
        condition: service_completed_successfully
    command: node dist/src/main.js

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://pro.secours-infirmiers.fr
    init: true
    restart: always
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
